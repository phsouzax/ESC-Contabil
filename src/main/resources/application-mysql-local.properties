# Configuração local opcional da máquina instalada (senha do banco etc.).
# Valores deste arquivo sobrescrevem os abaixo. Veja installer/esc.properties.example.
spring.config.import=optional:file:${APPDATA:${user.home}}/ESCContabil/esc.properties

# Abre o navegador ao iniciar (usado pelo instalador).
app.open-browser=${ESC_OPEN_BROWSER:true}

# Banco MySQL Community instalado no computador da empresa.
# Informe a senha em ESC_DB_PASSWORD; não grave credenciais neste arquivo.
spring.datasource.url=${ESC_DB_URL:jdbc:mysql://127.0.0.1:3306/esc_contabil}
spring.datasource.username=${ESC_DB_USERNAME:esc_app}
spring.datasource.password=${ESC_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O Flyway cria e atualiza o esquema. Hibernate apenas confere o mapeamento.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
