name: Installer

# Gera o Setup .exe no GitHub (não precisa instalar WiX/JDK no seu PC).
# Rode em: Actions > Installer > Run workflow, e baixe o artefato.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Garantir WiX no PATH
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wix) { choco install wixtoolset -y --no-progress; $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin" | Select-Object -First 1 }
            $wix.FullName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: Build e instalador
        shell: cmd
        run: installer\build-installer.bat

      - uses: actions/upload-artifact@v4
        with:
          name: esc-contabil-setup
          path: installer/output/*.exe
          if-no-files-found: error
          retention-days: 30
