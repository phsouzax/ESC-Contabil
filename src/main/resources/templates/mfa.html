<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verificação em duas etapas | ESC Contábil</title>
    <style>
        :root{--navy:#0b2c45;--blue:#123b5b;--ink:#173247;--muted:#667786;--line:#dfe7ec;--paper:#f4f7f9}
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,Arial,sans-serif}
        .card{width:min(430px,100%);padding:30px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 10px 35px #0b2c4512}
        h1{margin:0;color:var(--navy);font-size:23px}.sub{margin:6px 0 20px;color:var(--muted)}label{display:grid;gap:7px;font-size:13px;font-weight:700}
        input{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:20px;letter-spacing:.25em;text-align:center}
        button{width:100%;min-height:44px;margin-top:14px;border:0;border-radius:8px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}.message{margin:12px 0;padding:10px 12px;border-radius:8px;background:#fff5df;color:#674711;font-size:13px}
        form.logout{margin-top:9px}button.secondary{border:1px solid var(--line);background:#fff;color:var(--blue)}
    </style>
</head>
<body>
<main class="card">
    <h1>Verificação de segurança</h1>
    <p class="sub">Digite o código atual do Google Authenticator. Esta verificação é solicitada no primeiro pareamento e a cada 15 dias.</p>
    <div class="message" th:if="${mfaError}" th:text="${mfaError}"></div>
    <form method="post" th:action="@{/mfa}">
        <label>Código de seis dígitos<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" autofocus></label>
        <p class="sub">Se perdeu acesso ao celular, use um dos códigos de recuperação que guardou.</p>
        <label>Código de recuperação<input name="recoveryCode" autocomplete="off" placeholder="XXXX XXXX XXXX XXXX"></label>
        <button type="submit">Verificar e continuar</button>
    </form>
    <form class="logout" method="post" th:action="@{/logout}"><button class="secondary" type="submit">Sair</button></form>
</main>
</body>
</html>
