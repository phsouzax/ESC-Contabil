<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | ESC Contábil</title>
    <style>
        :root{--navy:#0b2c45;--blue:#123b5b;--gold:#d5a12b;--ink:#173247;--muted:#667786;--line:#dfe7ec;--paper:#f4f7f9}
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,Arial,sans-serif}
        .card{width:min(430px,100%);padding:30px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 10px 35px #0b2c4512}
        h1{margin:0;color:var(--navy);font-size:24px}.sub{margin:5px 0 22px;color:var(--muted)}label{display:grid;gap:6px;margin:14px 0;color:var(--ink);font-size:13px;font-weight:700}
        input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}button{width:100%;min-height:44px;margin-top:10px;border:0;border-radius:8px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}
        .message{margin:12px 0;padding:10px 12px;border-radius:8px;background:#fff5df;color:#674711;font-size:13px}.codes{padding:14px;border:1px solid #e8d39b;border-radius:9px;background:#fffaf0;font-size:12px}.codes code{display:block;margin:3px 0;color:var(--navy);font-weight:700;letter-spacing:.05em}
    </style>
</head>
<body>
<main class="card">
    <h1>ESC Contábil</h1><p class="sub">Entre para acessar os recebíveis.</p>
    <div class="message" th:if="${loginError}">Usuário ou senha inválidos.</div>
    <div class="message" th:if="${loggedOut}">Você saiu do sistema.</div>
    <div class="message" th:if="${setupComplete}" th:text="${setupComplete}"></div>
    <section class="codes" th:if="${recoveryCodes}">
        <strong>Guarde estes códigos de recuperação em local seguro.</strong>
        <span>Cada código pode ser usado uma única vez.</span>
        <code th:each="recoveryCode : ${recoveryCodes}" th:text="${recoveryCode}"></code>
    </section>
    <form method="post" th:action="@{/login}">
        <label>Usuário<input name="username" autocomplete="username" required autofocus></label>
        <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Entrar</button>
    </form>
</main>
</body>
</html>
