# Banco MySQL Community instalado no computador da empresa.
# Informe a senha em ESC_DB_PASSWORD; não grave credenciais neste arquivo.
spring.datasource.url=${ESC_DB_URL:jdbc:mysql://127.0.0.1:3306/esc_contabil}
spring.datasource.username=${ESC_DB_USERNAME:esc_app}
spring.datasource.password=${ESC_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O Flyway cria e atualiza o esquema. Hibernate apenas confere o mapeamento.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
